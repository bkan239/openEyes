[project]
name = "openeyes-api"
version = "0.1.0"
description = "OpenEyes verification API — FastAPI on AWS Lambda."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "mangum>=0.18",
    "boto3>=1.34",
    "openai>=1.50",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "feedparser>=6.0",
    "httpx>=0.27",
    "azure-data-tables>=12.5",
]

[dependency-groups]
dev = [
    "uvicorn[standard]>=0.32",
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
