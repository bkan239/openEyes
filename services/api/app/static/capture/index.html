<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenEyes Capture</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        padding: 1rem;
        max-width: 36rem;
        margin-inline: auto;
      }
      h1 {
        margin-top: 0;
        font-size: 1.3rem;
      }
      .stack {
        display: grid;
        gap: 0.8rem;
      }
      .actions {
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
      }
      button,
      .button {
        border: 1px solid #888;
        background: transparent;
        border-radius: 0.6rem;
        padding: 0.65rem 0.9rem;
        font-size: 0.95rem;
      }
      input[type="file"] {
        display: none;
      }
      img {
        width: 100%;
        border-radius: 0.7rem;
        border: 1px solid #8884;
      }
      .meta {
        opacity: 0.85;
        font-size: 0.92rem;
      }
      .hidden {
        display: none;
      }
      #status {
        min-height: 1.2rem;
        font-size: 0.92rem;
      }
    </style>
  </head>
  <body>
    <h1>Photo Capture</h1>
    <div class="stack">
      <label class="button" for="cameraInput">Take Photo</label>
      <input id="cameraInput" type="file" accept="image/*" capture="environment" />

      <img id="preview" alt="Preview" class="hidden" />
      <div id="capturedAt" class="meta hidden"></div>

      <div class="actions">
        <button id="sendBtn" class="hidden" type="button">Send to API</button>
        <button id="discardBtn" class="hidden" type="button">Discard</button>
        <button id="newBtn" class="hidden" type="button">New Photo</button>
      </div>

      <div id="status"></div>
    </div>

    <script>
      const input = document.getElementById("cameraInput");
      const preview = document.getElementById("preview");
      const capturedAtEl = document.getElementById("capturedAt");
      const sendBtn = document.getElementById("sendBtn");
      const discardBtn = document.getElementById("discardBtn");
      const newBtn = document.getElementById("newBtn");
      const statusEl = document.getElementById("status");

      let currentFile = null;
      let capturedAt = null;

      function resetCapture() {
        currentFile = null;
        capturedAt = null;
        input.value = "";
        preview.classList.add("hidden");
        capturedAtEl.classList.add("hidden");
        sendBtn.classList.add("hidden");
        discardBtn.classList.add("hidden");
        newBtn.classList.add("hidden");
      }

      function showStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.style.color = isError ? "#cc2f2f" : "";
      }

      input.addEventListener("change", () => {
        const file = input.files && input.files[0];
        if (!file) {
          return;
        }

        currentFile = file;
        capturedAt = new Date().toISOString();

        preview.src = URL.createObjectURL(file);
        preview.classList.remove("hidden");
        capturedAtEl.textContent = `Captured at: ${capturedAt}`;
        capturedAtEl.classList.remove("hidden");
        sendBtn.classList.remove("hidden");
        discardBtn.classList.remove("hidden");
        newBtn.classList.add("hidden");
        showStatus("");
      });

      discardBtn.addEventListener("click", () => {
        resetCapture();
        showStatus("Photo discarded.");
      });

      newBtn.addEventListener("click", () => {
        resetCapture();
        showStatus("");
      });

      sendBtn.addEventListener("click", async () => {
        if (!currentFile || !capturedAt) {
          showStatus("Take a photo first.", true);
          return;
        }

        sendBtn.disabled = true;
        showStatus("Uploading...");

        try {
          const form = new FormData();
          form.append("file", currentFile);
          form.append("captured_at", capturedAt);

          const response = await fetch("/captures", {
            method: "POST",
            body: form,
          });
          if (!response.ok) {
            throw new Error(`Upload failed (${response.status})`);
          }

          const payload = await response.json();
          showStatus(`Uploaded: ${payload.id}`);
          sendBtn.classList.add("hidden");
          discardBtn.classList.add("hidden");
          newBtn.classList.remove("hidden");
        } catch (error) {
          showStatus(error.message || "Upload failed.", true);
        } finally {
          sendBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
